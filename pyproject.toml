[project]
name = "project-based-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maqsudbek", email = "dehkanaliev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.2",
    "imagekitio>=5.10.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
project-based-fastapi = "project_based_fastapi:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
